spring.application.name=genai-worker
spring.main.web-application-type=none
# Ohne Webserver und Listener würde sich der Prozess sonst direkt nach dem Start beenden
spring.main.keep-alive=true

# Google Gemini
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# Logging
logging.level.com.docmanager=INFO
logging.level.root=WARN
