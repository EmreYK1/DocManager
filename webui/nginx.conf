server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API-Requests an den REST-Server weiterleiten (/api/... -> /...)
    location /api/ {
        proxy_pass http://document-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA-Fallback: React-Router-Routen funktionieren auch beim direkten Aufruf/Reload
    location / {
        try_files $uri /index.html;
    }
}
