server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Maximale Upload-Größe (verhindert 413-Fehler bei größeren Dateien)
    client_max_body_size 50m;

    # API-Requests an den REST-Server weiterleiten (/api/... -> /...)
    location /api/ {
        proxy_pass http://document-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Ausreichend Zeit für größere Uploads
        proxy_read_timeout 60s;

        # Upload-Body direkt zum Backend streamen (kein nginx-internes Buffering)
        proxy_request_buffering off;
    }

    # SPA-Fallback: React-Router-Routen funktionieren auch beim direkten Aufruf/Reload
    location / {
        try_files $uri /index.html;
    }
}
