name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: docmanager
          POSTGRES_USER: docmanager
          POSTGRES_PASSWORD: docmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docmanager -d docmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run unit tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/docmanager
          DB_USER: docmanager
          DB_PASSWORD: docmanager
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: '5672'
          RABBITMQ_USER: guest
          RABBITMQ_PASS: guest
        run: mvn -B test

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
