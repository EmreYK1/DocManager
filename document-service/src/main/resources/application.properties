spring.application.name=document-service
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/docmanager}
spring.datasource.username=${DB_USER:docmanager}
spring.datasource.password=${DB_PASSWORD:docmanager}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
