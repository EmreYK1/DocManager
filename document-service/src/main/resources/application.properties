spring.application.name=document-service
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/docmanager}
spring.datasource.username=${DB_USER:docmanager}
spring.datasource.password=${DB_PASSWORD:docmanager}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# RabbitMQ Queue-Konfiguration
app.rabbitmq.queue.document-processing=${RABBITMQ_QUEUE_DOCUMENT_PROCESSING:document.processing}
app.rabbitmq.exchange=${RABBITMQ_EXCHANGE:docmanager.exchange}
app.rabbitmq.routing-key.document=${RABBITMQ_ROUTING_KEY_DOCUMENT:document.process}

# Logging

logging.level.com.docmanager=INFO
logging.level.org.springframework.amqp=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.root=WARN