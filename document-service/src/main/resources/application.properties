spring.application.name=document-service
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/docmanager}
spring.datasource.username=${DB_USER:docmanager}
spring.datasource.password=${DB_PASSWORD:docmanager}

# Das Schema verwaltet Flyway, Hibernate prüft nur, ob es zu den Entities passt
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Übernimmt Datenbanken, die noch ohne Flyway angelegt wurden
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.publisher-confirm-type=simple
# Fehlgeschlagene Nachrichten werden wiederholt und landen danach in der Dead-Letter-Queue
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=3


# Multipart Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# MinIO
app.minio.url=${MINIO_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.minio.bucket=${MINIO_BUCKET:documents}

# Elasticsearch (Verbindung wird erst bei der ersten Anfrage aufgebaut)
spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://localhost:9200}
app.elasticsearch.index=${ELASTICSEARCH_INDEX:documents}

# Logging
logging.level.com.docmanager=INFO
logging.level.org.springframework.amqp=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.root=WARN
